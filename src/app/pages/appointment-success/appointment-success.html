<section class="page-section py-5">
  <div class="container">
    <div class="success-card mx-auto text-center p-4 p-md-5 shadow-sm">
      <div class="success-icon mx-auto mb-3"><i class="bi bi-check-lg"></i></div>
      <h1 class="h2 fw-bold">¡Cita agendada con éxito!</h1>
      <p class="text-secondary mb-4">Tu cita quedó registrada en el sistema.</p>
      <div class="details-box text-start mx-auto" *ngIf="appointment">
        <h2 class="h5 fw-bold mb-3">Detalles de la cita</h2>
        <div class="detail-line">
          <i class="bi bi-calendar-event"></i
          ><span>{{ appointment.date | date: 'dd/MM/yyyy' }}</span>
        </div>
        <div class="detail-line">
          <i class="bi bi-clock"></i><span>{{ appointment.time }}</span>
        </div>
        <div class="detail-line">
          <i class="bi bi-heart"></i><span>{{ appointment.pet }} ({{ appointment.petType }})</span>
        </div>
        <div class="detail-line">
          <i class="bi bi-clipboard2-pulse"></i><span>{{ appointment.service }}</span>
        </div>
      </div>
      <div class="d-grid gap-2 mt-4">
        <a routerLink="/citas" class="btn btn-success py-2">Ver en mis citas</a
        ><a routerLink="/inicio" class="btn btn-outline-secondary py-2">Regresar al inicio</a>
      </div>
    </div>
  </div>
</section>
