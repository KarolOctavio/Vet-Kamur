<section class="page-section py-5">
  <div class="container narrow-container">
    <a routerLink="/pago" class="btn btn-light mb-3"><i class="bi bi-arrow-left me-1"></i>Pago</a>
    <div class="content-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-bank"></i></div>
        <h1 class="h2 fw-bold">Transferencia</h1>
        <p class="text-secondary">Realiza tu transferencia a la siguiente cuenta.</p>
      </div>
      <div class="bank-box">
        <div>
          <span>Número</span><strong>{{ account }}</strong>
        </div>
        <div><span>Titular</span><strong>Vet-Kamur</strong></div>
        <div><span>Banco</span><strong>Banco de demostración</strong></div>
      </div>
      <button class="btn btn-outline-success w-100 mt-3" (click)="copy()">
        <i class="bi bi-copy me-2"></i>{{ copied ? 'Número copiado' : 'Copiar número' }}
      </button>
      <hr class="my-4" />
      <p class="text-center fw-semibold">Después de realizar tu pago, sube tu comprobante.</p>
      <label class="upload-box"
        ><i class="bi bi-cloud-arrow-up"></i><span>{{ fileName || 'Seleccionar comprobante' }}</span
        ><input type="file" accept="image/*,.pdf" required (change)="file($event)" hidden
      /></label>
      <div class="alert alert-success mt-3" *ngIf="fileName">
        Comprobante seleccionado: {{ fileName }}
      </div>
      <button class="btn btn-success w-100 mt-3" [disabled]="!fileName" (click)="finish()">
        Finalizar
      </button>
    </div>
  </div>
</section>
